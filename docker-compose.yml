version: '3.8'

services:
  jira_coder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_coder_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run jira_coder_ui.py --server.address=0.0.0.0 --server.port=8501
